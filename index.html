<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Programma Nutrizionale</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Programma">
<meta name="theme-color" content="#0B0B0A" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0C0B" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">

<style>
  :root{
    color-scheme:light dark;
    --paper:#FDFAF4;--ink:#241F19;--ink-2:#6B6055;--ink-3:#9C9184;
    --rule:#241F19;--hair:rgba(36,31,25,.15);
    --hi:#F5D547;--hi-ink:#241F19;
    --bar:#241F19;--bar-ink:#FDFAF4;
    --lift:rgba(36,31,25,.045);
    /* Un colore per fascia di pasto: è il sistema che tiene insieme griglia e schede */
    --c1:#E39A18;--c2:#6DAD3C;--c3:#DE4C28;--c4:#0FA69D;--c5:#8B4FC4;
    --mP:#0FA69D;--mC:#E39A18;--mG:#8B4FC4;
    --sans:'Archivo',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;
    --cond:88%;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#17140F;--ink:#F3EEE4;--ink-2:#A79C8D;--ink-3:#7A7063;
      --rule:#F3EEE4;--hair:rgba(243,238,228,.2);
      --hi:#E8C93B;--lift:rgba(243,238,228,.06);
      --bar:#0E0C09;--bar-ink:#F3EEE4;
      --c1:#F0B143;--c2:#8AC85A;--c3:#EE6647;--c4:#2BC0B6;--c5:#A76CDC;
      --mP:#2BC0B6;--mC:#F0B143;--mG:#A76CDC;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;
    line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100dvh;overflow-x:hidden;
    padding-bottom:calc(40px + env(safe-area-inset-bottom));
  }
  ::selection{background:var(--hi);color:var(--hi-ink)}
  .wrap{max-width:620px;margin:0 auto;padding:0 20px}

  /* Testata: blocco pieno, come la fascia scura di una confezione */
  .topbar{position:sticky;top:0;z-index:30;background:var(--bar);
    padding:calc(env(safe-area-inset-top) + 12px) 0 11px}
  .topbar-inner{max-width:620px;margin:0 auto;padding:0 20px;display:flex;align-items:baseline;gap:7px}
  .brand{display:flex;align-items:baseline;gap:7px}
  .brand b{font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.02em;
    font-stretch:var(--cond);color:var(--bar-ink)}
  .brand .n{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;
    color:var(--bar-ink);opacity:.6}

  .hero{padding:22px 0 0}
  .hero h1{font-weight:800;font-size:clamp(38px,11vw,54px);line-height:1;font-stretch:88%;letter-spacing:-.03em}
  .hero .date{color:var(--ink-2);font-size:13.5px;margin-top:8px;font-weight:500}
  /* Le prescrizioni giornaliere non sono piu' testo inerte: si toccano.
     Valgono sempre per oggi, anche mentre sfogli un altro giorno. */
  .oggi-wrap{margin-top:14px;padding-top:11px;border-top:1px solid var(--hair)}
  .oggi-h{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-3);margin-bottom:8px}
  .reminders{display:flex;flex-wrap:wrap;gap:6px}
  .rem{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
    color:var(--ink-2);background:var(--lift);border:1px solid transparent;border-radius:99px;
    padding:6px 11px;font-family:inherit;position:relative;overflow:hidden;
    -webkit-tap-highlight-color:transparent}
  .rem .v{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:800}
  .rem i{display:none}
  button.rem{cursor:pointer;transition:.13s ease}
  button.rem:hover{border-color:var(--ink-3)}
  button.rem:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .rem.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .rem.on .v{color:var(--paper);opacity:.7}
  .rem.on::before{content:"";width:4.5px;height:8.5px;flex:0 0 auto;margin-right:1px;
    border:solid var(--paper);border-width:0 2px 2px 0;transform:rotate(45deg) translateY(-1px)}
  /* Acqua: il riempimento e' dietro al testo, cosi' il progresso si vede a colpo d'occhio */
  .rem.acqua{padding-right:4px;gap:5px}
  .rem.acqua .fill{position:absolute;left:0;top:0;bottom:0;background:var(--c4);opacity:.22;
    transition:width .2s ease;pointer-events:none}
  .rem.acqua.full .fill{opacity:.34}
  .rem.acqua>span{position:relative;z-index:1}
  .mini{position:relative;z-index:1;width:22px;height:22px;border-radius:99px;flex:0 0 auto;
    border:none;background:rgba(0,0,0,.06);color:var(--ink);font:700 14px/1 inherit;cursor:pointer;
    display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
  .mini:hover{background:rgba(0,0,0,.14)}
  @media (prefers-color-scheme:dark){
    .mini{background:rgba(255,255,255,.12)}
    .mini:hover{background:rgba(255,255,255,.22)}
  }

  /* Selettore di sezione */
  .seg{display:flex;gap:3px;margin-top:20px;background:var(--lift);padding:4px;border-radius:12px}
  .seg button{flex:1;font-family:inherit;font-size:12.5px;font-weight:700;padding:9px 5px;border:none;
    border-radius:9px;background:none;color:var(--ink-3);cursor:pointer;transition:.13s ease;
    -webkit-tap-highlight-color:transparent}
  .seg button:hover{color:var(--ink)}
  .seg button[aria-selected="true"]{background:var(--paper);color:var(--ink);
    box-shadow:0 1px 3px rgba(36,31,25,.13)}
  .seg button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}

  /* Griglia settimanale: righe = fasce di pasto, colonne = giorni */
  .gridwrap{padding:20px 0 6px}
  .grid{display:grid;grid-template-columns:44px repeat(7,1fr);gap:5px;align-items:center}
  .ghead{font-family:inherit;font-size:10.5px;font-weight:700;color:var(--ink-3);text-align:center;
    text-transform:uppercase;letter-spacing:.04em;padding:0 0 3px;background:none;border:none;
    cursor:pointer;-webkit-tap-highlight-color:transparent}
  .ghead:hover,.ghead.today{color:var(--ink)}
  .ghead.today{font-weight:800}
  .grow{font-size:9.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;
    letter-spacing:.02em;line-height:1.1;padding-right:3px}
  .cell{aspect-ratio:1;border:none;border-radius:9px;cursor:pointer;padding:0;
    background:color-mix(in srgb,var(--c) 20%,var(--paper));
    transition:background .13s ease,transform .1s ease;-webkit-tap-highlight-color:transparent}
  /* Righe fisse: piu' basse e piu' tenui. Restano toccabili per le spunte,
     ma smettono di gridare quanto pranzo e cena. */
  .cell.fisso{aspect-ratio:auto;height:26px;border-radius:7px;
    background:color-mix(in srgb,var(--c) 13%,var(--paper))}
  .grow.fisso{opacity:.62;font-size:9px}
  .cell:hover{background:color-mix(in srgb,var(--c) 45%,var(--paper))}
  .cell.fisso:hover{background:color-mix(in srgb,var(--c) 34%,var(--paper))}
  .cell:active{transform:scale(.92)}
  .cell.today{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 60%,var(--paper))}
  .cell[aria-selected="true"]{background:var(--c);
    box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--c)}
  .cell:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  /* Pasto fatto: spunta nel colore della fascia, leggibile sia su tinta sia su pieno */
  .cell.done{position:relative}
  .cell.done::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:11px;
    margin:-7px 0 0 -3px;transform:rotate(45deg);
    border:solid color-mix(in srgb,var(--c) 78%,var(--ink));border-width:0 2.5px 2.5px 0}
  .cell.done[aria-selected="true"]::after{border-color:var(--paper)}
  /* Puntino d'angolo: questo pasto vuole un cereale gia' cotto */
  .cell.prep::before{content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;
    border-radius:99px;background:color-mix(in srgb,var(--c) 85%,var(--ink))}
  .cell.prep{position:relative}
  .cell.prep[aria-selected="true"]::before{background:var(--paper)}
  .gridnote{font-size:11.5px;color:var(--ink-3);margin-top:11px;text-align:center}
  .gridnote b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
  .linkbtn{font-family:inherit;font-size:11.5px;color:var(--ink-3);background:none;border:none;
    padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  .linkbtn:hover{color:var(--ink)}

  .donebtn{margin-top:20px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;
    padding:10px 16px;border-radius:99px;border:2px solid var(--hair);background:none;
    color:var(--ink-2);transition:.13s ease;-webkit-tap-highlight-color:transparent}
  .donebtn:hover{border-color:var(--c,var(--ink));color:var(--ink)}
  /* Pieno neutro, non nel colore della fascia: su ambra o verde chiaro il bianco non si legge */
  .donebtn.on{background:var(--ink);border-color:var(--ink);color:var(--paper);
    padding-left:34px;position:relative}
  .donebtn.on::before{content:"";position:absolute;left:16px;top:50%;width:5px;height:10px;
    margin-top:-6px;transform:rotate(45deg);border:solid var(--paper);border-width:0 2.5px 2.5px 0}
  .donebtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  /* Macro: gli stessi tre colori ovunque, così si riconoscono senza legenda */
  .chip .kc{flex:0 0 auto;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;
    text-align:right;white-space:nowrap}
  .mtot{margin-top:14px;padding:13px 14px;background:var(--lift);border-radius:10px}
  .mtot.vuoto{font-size:12.5px;color:var(--ink-3);background:none;padding:8px 0}
  .mtot-r{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .mtot-r b{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .mtot-r span{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .mtot-r em{font-style:normal;font-weight:800;color:var(--m);margin-left:6px}
  .mbar{display:flex;height:6px;border-radius:99px;overflow:hidden;margin-top:9px;background:var(--hair)}
  .mbar i{display:block}
  .mnote{font-size:11.5px;color:var(--ink-3);margin-top:7px}

  .recap{margin-top:16px;padding:15px 16px;border:1px solid var(--hair);border-radius:13px}
  .rc-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;margin-bottom:13px}
  .rc-n{font-weight:600;color:var(--ink-3);letter-spacing:.03em;text-transform:none;font-size:11.5px}
  .rc-r{display:flex;align-items:center;gap:10px;padding:4px 0}
  .rc-l{flex:0 0 62px;font-size:12px;font-weight:600;color:var(--ink-2)}
  .rc-bar{flex:1;height:8px;border-radius:99px;background:var(--hair);overflow:hidden}
  .rc-bar i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .25s ease}
  .rc-r:nth-child(2) .rc-bar i{background:var(--ink)}
  .rc-r:nth-child(3) .rc-bar i{background:var(--mP)}
  .rc-r:nth-child(4) .rc-bar i{background:var(--mC)}
  .rc-r:nth-child(5) .rc-bar i{background:var(--mG)}
  .rc-v{flex:0 0 82px;text-align:right;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .rc-v b{color:var(--ink);font-weight:700}
  .rc-rest{margin-top:12px;padding-top:11px;border-top:1px solid var(--hair);font-size:13px;color:var(--ink-2)}
  .rc-rest b{color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
  .rc-note{margin-top:8px;font-size:11px;color:var(--ink-3);line-height:1.4}

  .comp{margin-top:12px;padding-top:11px;border-top:1px solid var(--hair)}
  .comp-h{display:flex;align-items:center;justify-content:space-between;gap:10px;
    font-size:13px;color:var(--ink-2);flex-wrap:wrap}
  .comp-h b{color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
  .sg-list{list-style:none;margin-top:9px}
  .sg-list li{display:flex;align-items:baseline;gap:9px;padding:7px 0;
    border-bottom:1px solid var(--hair);font-size:13.5px}
  .sg-list li:last-child{border-bottom:none}
  .sg-list li span{flex:1}
  .sg-list li b{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-2)}
  .sg-x{flex:0 0 auto;width:22px;height:22px;border-radius:99px;border:none;cursor:pointer;
    background:var(--lift);color:var(--ink-2);font:400 15px/1 inherit;
    display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
  .sg-x:hover{background:var(--c3);color:#fff}

  .sg-pick{margin-top:10px}
  .sg-pick summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
    font-size:12.5px;font-weight:700;color:var(--ink-2);padding:8px 13px;border-radius:99px;
    border:1px solid var(--hair);-webkit-tap-highlight-color:transparent;transition:.13s ease}
  .sg-pick summary::-webkit-details-marker{display:none}
  .sg-pick summary::before{content:"+";font-size:15px;font-weight:700;line-height:1;
    display:inline-block;transition:transform .16s ease}
  .sg-pick summary:hover{border-color:var(--ink-3);color:var(--ink)}
  .sg-pick[open] summary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .sg-pick[open] summary::before{transform:rotate(45deg)}
  .sg-body{margin-top:12px}
  .sg-cat{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-3);margin:12px 0 7px}
  .sg-cat:first-child{margin-top:0}
  .sg-row{display:flex;flex-wrap:wrap;gap:6px}
  .sg-chip{font-family:inherit;font-size:12.5px;font-weight:500;color:var(--ink);cursor:pointer;
    background:var(--lift);border:1px solid transparent;border-radius:99px;padding:7px 12px;
    transition:.13s ease;-webkit-tap-highlight-color:transparent}
  .sg-chip b{font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink-3);margin-left:3px}
  .sg-chip:hover{border-color:var(--ink);background:none}
  .sg-chip:active{transform:scale(.96)}
  .sg-chip.mio{background:none;border-color:var(--hair);border-style:dashed}
  .sg-chip.mio:hover{border-style:solid;border-color:var(--ink)}

  .sg-new{margin-top:16px;padding-top:14px;border-top:1px solid var(--hair)}
  .sg-new summary{list-style:none;cursor:pointer;font-size:12.5px;font-weight:700;
    color:var(--ink-2);-webkit-tap-highlight-color:transparent}
  .sg-new summary::-webkit-details-marker{display:none}
  .sg-new summary::before{content:"+ ";font-weight:800}
  .sg-new summary:hover{color:var(--ink)}
  .sg-form{margin-top:12px}
  .fin{width:100%;font-family:inherit;font-size:14px;color:var(--ink);background:var(--lift);
    border:1px solid var(--hair);border-radius:8px;padding:10px 12px}
  .fin:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
  .sg-num{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}
  .sg-num label{display:flex;flex-direction:column;gap:4px;font-size:10.5px;font-weight:700;
    letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
  .sg-num .fin{padding:9px 8px;text-align:center;font-variant-numeric:tabular-nums}
  .sg-help{font-size:11.5px;color:var(--ink-3);margin-top:9px;line-height:1.45}

  .comp-btns{display:flex;align-items:center;gap:6px}
  .comp-n{font-size:12.5px;color:var(--ink-3);margin-top:9px}
  .comp-n b{color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
  .comp-n b.ok{color:var(--c2)}
  .comp-l{list-style:none;margin-top:6px}
  .comp-i{display:flex;width:100%;align-items:baseline;gap:10px;padding:8px 0;background:none;
    border:none;border-bottom:1px solid var(--hair);font-family:inherit;font-size:13.5px;
    color:var(--ink);text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .comp-i span{flex:1}
  .comp-i em{font-style:normal;font-size:11px;color:var(--ink-3);text-transform:uppercase;
    letter-spacing:.06em;margin-left:5px}
  .comp-i b{flex:0 0 auto;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-2)}
  .comp-i.on{color:var(--ink-3)}
  .comp-i.on span{text-decoration:line-through}
  .comp-i.on b{color:var(--c2)}
  .comp-l li:last-child .comp-i{border-bottom:none}

  .aderenza{margin-top:14px}
  .ad-r{display:flex;align-items:center;gap:10px;padding:5px 0}
  .ad-w{flex:0 0 96px;font-size:11.5px;font-weight:600;color:var(--ink-2)}
  .ad-bar{flex:1;height:8px;border-radius:99px;background:var(--hair);overflow:hidden}
  .ad-bar i{display:block;height:100%;border-radius:99px;background:var(--c2)}
  .ad-v{flex:0 0 72px;text-align:right;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .ad-v b{color:var(--ink);font-weight:800}

  .day-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.13em;
    color:var(--ink-3);margin:22px 0 14px}
  .rgroup{font-weight:900;font-size:24px;text-transform:uppercase;font-stretch:80%;letter-spacing:-.005em;
    margin:38px 0 0;padding-top:14px;border-top:3px solid var(--rule);line-height:1.05}
  .rgroup small{display:block;font-weight:500;font-size:13px;font-stretch:100%;
    color:var(--ink-2);letter-spacing:0;margin-top:6px;line-height:1.45;text-transform:none}
  /* Niente doppia barra: la sezione che segue un titolo non ripete il proprio filetto */
  .day-label+.card,.rgroup+.card{border-top:none;padding-top:18px}

  .swap{margin-top:18px;padding:13px 15px;background:var(--lift);border-left:4px solid var(--rule);
    font-size:13px;color:var(--ink-2);line-height:1.45}
  .swap b{display:block;font-size:10.5px;font-weight:800;letter-spacing:.12em;
    text-transform:uppercase;color:var(--ink);margin-bottom:6px}
  .swap i{font-style:normal;display:block;padding:2px 0}

  .filters{display:flex;flex-wrap:wrap;gap:6px;margin:22px 0 -16px}
  .fchip{font-family:inherit;font-size:11.5px;font-weight:700;padding:9px 12px;border-radius:0;
    text-transform:uppercase;letter-spacing:.07em;cursor:pointer;background:none;
    border:2px solid var(--rule);color:var(--ink);transition:.12s ease;-webkit-tap-highlight-color:transparent}
  .fchip:hover{background:var(--hi);color:var(--hi-ink)}
  .fchip[aria-pressed="true"]{background:var(--rule);color:var(--paper)}
  .fchip:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
  .fchip span{font-variant-numeric:tabular-nums;opacity:.55;margin-left:3px}

  /* Ogni pasto porta il colore della sua fascia, come nella griglia */
  .card{padding:20px 0 24px;border-top:1px solid var(--hair)}
  .card:first-of-type{border-top:none;padding-top:20px}
  .card .meal-top{display:flex;align-items:baseline;justify-content:space-between;gap:14px}
  .kick{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:800;
    letter-spacing:.11em;text-transform:uppercase;margin-bottom:6px;color:var(--c,var(--ink-3))}
  .kick::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--c,var(--ink-3))}
  .mtitle{font-weight:800;font-size:25px;line-height:1.1;font-stretch:90%;letter-spacing:-.02em}
  .timepill{flex:0 0 auto;font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--ink-2);
    background:var(--lift);border-radius:99px;padding:4px 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .timepill svg{display:none}

  .ing{list-style:none;margin:16px 0 0;border-top:1px solid var(--hair)}
  .ing li{border-bottom:1px solid var(--hair)}

const PLAN_KEY='piano11-plan-v1';

function clonePlan(p){return JSON.parse(JSON.stringify(p));}

function validatePlan(p){
  if(!p||typeof p!=='object') return 'Il piano deve essere un oggetto JSON valido.';
  if(!p.colazione||!Array.isArray(p.colazione.ing)) return 'Manca "colazione" con un array "ing".';
  if(!p.spMattino||!Array.isArray(p.spMattino.ing)) return 'Manca "spMattino" con un array "ing".';
  if(!p.spPomeriggio||!Array.isArray(p.spPomeriggio.ing)) return 'Manca "spPomeriggio" con un array "ing".';
  if(!Array.isArray(p.days)||p.days.length!==7) return '"days" deve essere un array di 7 giorni.';
  for(const d of p.days){
    if(!d.name||!d.full) return 'Ogni giorno richiede "name" e "full".';
    if(!d.pranzo||!Array.isArray(d.pranzo.ing)||!d.pranzo.title) return 'Ogni giorno richiede "pranzo" con "title" e "ing" (array).';
    if(!d.cena||!Array.isArray(d.cena.ing)||!d.cena.title) return 'Ogni giorno richiede "cena" con "title" e "ing" (array).';
  }
  return null;
}

function loadPlan(){
  try{
    const raw=localStorage.getItem(PLAN_KEY);
    if(!raw) return clonePlan(DEFAULT_PLAN);
    const parsed=JSON.parse(raw);
    if(validatePlan(parsed)) return clonePlan(DEFAULT_PLAN);
    return parsed;
  }catch(e){return clonePlan(DEFAULT_PLAN);}
}

function parseGrams(q){const m=String(q).replace(',','.').match(/([\d.]+)/);return m?parseFloat(m[1]):0;}
function fmtGrams(g){
  g=Math.round(g);
  if(g>=1000){const kg=g/1000;return (Number.isInteger(kg)?kg:kg.toFixed(1)).toString().replace('.',',')+' kg';}
  return g+' g';
}
// Arrotonda per eccesso a una quantità pratica da spesa
function roundPractical(g){
  if(g<=0) return 0;
  const step=g>=1000?100:50;
  return Math.ceil(g/step)*step;
}

function nutriDi(nome){const r=NUTRI.find(x=>x[0].test(nome));return r?r[1]:null;}

// Solo quantità in peso. "1 normale", "2 gusti", "q.b." non sono calcolabili.
// Unica eccezione: le uova a pezzi, contate a 55 g l'una (uovo medio).
function grammiDi(q,nome){
  const s=String(q).trim();
  if(!/\d/.test(s)) return null;
  if(/\bkg\b/i.test(s)) return parseGrams(s)*1000;
  if(/\bg\b/i.test(s)) return parseGrams(s);
  if(nome&&/uov/i.test(nome)&&/^\d+$/.test(s)) return parseGrams(s)*55;
  return null;
}

// Somma i macro di un pasto, segnalando le voci che non ha saputo contare
function macroPasto(m){
  let k=0,p=0,c=0,g=0;const fuori=[];
  (m&&m.ing||[]).forEach(i=>{
    const gr=grammiDi(i[1],i[0]), n=nutriDi(i[0]);
    if(gr===null||!n){fuori.push(i[0]);return;}
    k+=n[0]*gr/100;p+=n[1]*gr/100;c+=n[2]*gr/100;g+=n[3]*gr/100;
  });
  return {k:Math.round(k),p:Math.round(p),c:Math.round(c),g:Math.round(g),fuori};
}
function macroSomma(list){
  return list.reduce((a,m)=>{const t=macroPasto(m);
    return {k:a.k+t.k,p:a.p+t.p,c:a.c+t.c,g:a.g+t.g,fuori:a.fuori.concat(t.fuori)};},
    {k:0,p:0,c:0,g:0,fuori:[]});
}
function kcalDi(nome,qta){
  const gr=grammiDi(qta,nome), n=nutriDi(nome);
  return (gr===null||!n)?null:Math.round(n[0]*gr/100);
}
function barraMacro(t){
  const kp=t.p*4,kc=t.c*4,kg=t.g*9,tot=kp+kc+kg;
  if(!tot) return '';
  const w=x=>(x/tot*100).toFixed(1)+'%';
  return '<div class="mbar"><i style="width:'+w(kp)+';background:var(--mP)"></i>'
    +'<i style="width:'+w(kc)+';background:var(--mC)"></i>'
    +'<i style="width:'+w(kg)+';background:var(--mG)"></i></div>';
}
function bloccoMacro(t){
  // Se anche una sola voce non è pesabile il totale sarebbe fuorviante
  // (la pizzeria mostrava "38 kcal" contando solo il contorno): meglio nulla.
  if(t.fuori.length) return '<div class="mtot vuoto">Macro non calcolabili: '
    +[...new Set(t.fuori)].join(', ')+'.</div>';
  return '<div class="mtot"><div class="mtot-r"><b>'+t.k+' kcal</b>'
    +'<span><em style="--m:var(--mP)">P</em> '+t.p+' g <em style="--m:var(--mC)">C</em> '+t.c
    +' g <em style="--m:var(--mG)">G</em> '+t.g+' g</span></div>'+barraMacro(t)+'</div>';
}
// Accorpa i doppioni del piano in una voce di spesa unica
function normNome(name){
  const clean=String(name).replace(/\s*\([^)]*\)/g,'').trim();
  const n=clean.toLowerCase();
  if(n.includes('pasta')&&n.includes('uovo')) return 'Pasta all’uovo';
  if(n.includes('pasta')) return 'Pasta';
  if(n.startsWith('verdur')) return 'Verdure';
  if(n.startsWith('frutta secca')||n.includes('oleosa')) return 'Frutta secca';
  if(n.startsWith('frutta')) return 'Frutta fresca';
  if(n.includes('pollo')) return 'Pollo';
  if(n.includes('manzo')) return 'Manzo magro';
  return clean;
}

function buildSpesa(){
  const items={}; // nome canonico -> {qty, cat}
  const addMeal=(meal,mult)=>{(meal&&meal.ing||[]).forEach(pair=>{
    const nome=normNome(pair[0]);
    if(!nome) return;
    if(!items[nome]) items[nome]={qty:0,cat:categoriaSpesa(nome)};
    items[nome].qty+=parseGrams(pair[1])*mult;
  });};
  // Colazione e spuntini sono uguali ogni giorno → x7
  addMeal(PLAN.colazione,7);addMeal(PLAN.spMattino,7);addMeal(PLAN.spPomeriggio,7);
  PLAN.days.forEach(d=>{addMeal(d.pranzo,1);addMeal(d.cena,1);});
  const cats={'Carboidrati':[],'Proteine':[],'Verdura e frutta':[],'Dispensa':[],'Altro':[]};
  Object.keys(items).sort((a,b)=>a.localeCompare(b,'it')).forEach(nome=>{
    cats[items[nome].cat].push({nome,qty:items[nome].qty});
  });
  return cats;
}

function sameFood(ing,sub){
  const a=ing.toLowerCase(),b=sub.toLowerCase();
  if(/^altr/.test(b)) return false; // "Altro cereale", "Altra frutta"… sono volutamente generici
  return b.split(/[ ,(]/).filter(w=>w.length>3).some(w=>a.includes(w));
}
function webSubsFor(nome,qty){
  const g=parseGrams(qty);
  if(!g) return [];
  const rule=WEB_RULES.find(r=>r.re.test(nome));
  if(!rule) return [];
  return rule.subs.filter(s=>!sameFood(nome,s[0]))
    .map(s=>({nome:s[0],qty:fmtGrams(Math.round(g*s[1]/5)*5),nota:s[2]}));
}
function subsFor(m,idx){
  const ing=m.ing[idx];
  return {nome:ing[0],qty:ing[1],
    occhino:((m.sub&&m.sub[ing[0]])||[]).map(s=>({nome:s[0],qty:s[1]})),
    web:webSubsFor(ing[0],ing[1])};
}

function chips(m,mi){
  return '<ul class="ing">'+m.ing.map((i,idx)=>{
    const s=subsFor(m,idx);
    const kc=kcalDi(i[0],i[1]);
    const label='<span class="nm">'+i[0]+'</span>'
      +'<span class="kc">'+(kc===null?'':kc+' kcal')+'</span>'
      +'<span class="g">'+i[1]+'</span>';
    const row=(!s.occhino.length&&!s.web.length)
      ? '<span class="chip">'+label+'</span>'
      : '<button class="chip'+(s.occhino.length?' doc':'')+'" type="button" data-m="'+mi+'" data-i="'+idx+'" aria-haspopup="dialog">'+label+'</button>';
    return '<li>'+row+'</li>';
  }).join('')+'</ul>'+bloccoMacro(macroPasto(m));
}
function stepsList(a){return '<ol class="steps">'+a.map(s=>'<li>'+s+'</li>').join('')+'</ol>';}
// Chiusi di default: quasi sempre si guardano grammi e macro, i passaggi
// servono solo quando si cucina davvero. <details> perche' funziona anche
// senza JS ed e' gia' accessibile da tastiera.
function steps(a,label){
  return '<details class="prep-steps"><summary>'+(label||'Preparazione')
    +'<span>'+a.length+' passaggi</span></summary>'+stepsList(a)+'</details>';
}
function renderMeal(m,mi,col,slot){
  let h='<div class="card'+(m.accent?' accent':'')+'"'+(col?' style="--c:'+col+'"':'')+'>'
       +'<div class="meal-top"><div>';
  h+='<div class="kick">'+m.kick+'</div><div class="mtitle">'+m.title+'</div></div>';
  if(m.time) h+='<span class="timepill">'+clock+m.time+'</span>';
  h+='</div>'+chips(m,mi);
  if(m.liberi&&m.liberi!=='—') h+='<div class="liberi">Liberi: '+m.liberi+'</div>';
  if(m.oppure) h+='<div class="oppure"><span>Nota</span>'+m.oppure+'</div>';
  if(m.alts) h+='<div class="alts"><span>'+(m.altsTitle||'Alternative')+'</span><ul>'+m.alts.map(a=>'<li>'+a+'</li>').join('')+'</ul></div>';
  if(m.steps) h+=steps(m.steps);
  if(m.tip) h+='<div class="tip">'+bolt+'<div><b>Veloce.</b> '+m.tip+'</div></div>';
  if(slot){
    const fatto=DONE.has(slot);
    h+='<button class="donebtn'+(fatto?' on':'')+'" type="button" data-slot="'+slot+'" aria-pressed="'+fatto+'">'
      +(fatto?'Fatto':'Segna come fatto')+'</button>';
  }
  return h+'</div>';
}

// Pasti fatti. Sono legati alla settimana ISO, così il lunedì si riparte da zero
// senza doverli azzerare a mano.
function settimanaISO(d){
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));
  const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return t.getUTCFullYear()+'-W'+Math.ceil(((t-y0)/864e5+1)/7);
}
const DONE_KEY='piano11-fatti';
const SETTIMANA=settimanaISO(new Date());
// Prima di azzerare una settimana la si archivia: e' il dato che serve per
// dire al medico quanto si e' seguito il piano, e prima veniva buttato.
const STORICO_KEY='piano11-storico';
function loadStorico(){
  try{const s=JSON.parse(localStorage.getItem(STORICO_KEY)||'[]');return Array.isArray(s)?s:[];}
  catch(e){return [];}
}
function archiviaSettimana(w,arr){
  try{
    const st=loadStorico();
    if(!w||!arr.length||st.some(x=>x.w===w)) return;
    const per=[0,0,0,0,0];
    arr.forEach(k=>{const m=+String(k).split('-')[1];if(per[m]!==undefined)per[m]++;});
    st.push({w:w,n:arr.length,tot:35,per:per});
    while(st.length>26) st.shift();          // circa sei mesi
    localStorage.setItem(STORICO_KEY,JSON.stringify(st));
  }catch(e){}
}
function loadDone(){
  try{
    const o=JSON.parse(localStorage.getItem(DONE_KEY)||'{}');
    if(o.w===SETTIMANA) return new Set(o.d||[]);
    archiviaSettimana(o.w,o.d||[]);
    return new Set();
  }catch(e){return new Set();}
}
function saveDone(){
  try{localStorage.setItem(DONE_KEY,JSON.stringify({w:SETTIMANA,d:[...DONE]}));}catch(e){}
}
let DONE=loadDone();

// pasto libero e' settimanale come le spunte dei pasti.
const OGGI_KEY='piano11-oggi', LIBERO_KEY='piano11-libero';
const ACQUA_OBIETTIVO=12;              // bicchieri da 250 ml ≈ 3 L
function dataOggi(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function nuovoOggi(){return {d:dataOggi(),acqua:0,creatina:false,omega:false,sgarri:[]};}
function loadOggi(){
  try{
    const o=JSON.parse(localStorage.getItem(OGGI_KEY)||'{}');
    if(o.d!==dataOggi()) return nuovoOggi();
    const v=Object.assign(nuovoOggi(),o);
    if(!Array.isArray(v.sgarri)) v.sgarri=[];
    // vecchio formato: un totale libero in kcal, lo converto in voci "altro"
    if(o.extra>0&&!v.sgarri.length)
      v.sgarri=new Array(Math.round(o.extra/100)).fill('altro');
    delete v.extra;
    return v;
  }catch(e){return nuovoOggi();}
}
function saveOggi(){try{localStorage.setItem(OGGI_KEY,JSON.stringify(OGGI));}catch(e){}}
function loadLibero(){
  try{const o=JSON.parse(localStorage.getItem(LIBERO_KEY)||'{}');return o.w===SETTIMANA&&!!o.u;}
  catch(e){return false;}
}
function saveLibero(){try{localStorage.setItem(LIBERO_KEY,JSON.stringify({w:SETTIMANA,u:LIBERO}));}catch(e){}}

function renderOggi(){
  const box=document.getElementById('oggi');
  if(!box) return;
  const a=OGGI.acqua, perc=Math.min(100,a/ACQUA_OBIETTIVO*100);

  box.innerHTML=
    '<div class="rem acqua'+(a>=ACQUA_OBIETTIVO?' full':'')+'">'
     +'<span class="fill" style="width:'+perc+'%"></span>'
     +'<span>Acqua</span><span class="v">'+litri+' L</span>'
     +'<button class="mini" type="button" data-a="-1" aria-label="Un bicchiere in meno">−</button>'
     +'<button class="mini" type="button" data-a="1" aria-label="Un bicchiere in più">+</button>'
    +'</div>'
    +'<button class="rem'+(OGGI.creatina?' on':'')+'" type="button" data-k="creatina" aria-pressed="'+OGGI.creatina+'">Creatina <span class="v">5 g</span></button>'
    +'<button class="rem'+(OGGI.omega?' on':'')+'" type="button" data-k="omega" aria-pressed="'+OGGI.omega+'">Omega-3 <span class="v">1 g</span></button>'
    +'<button class="rem'+(LIBERO?' on':'')+'" type="button" data-k="libero" aria-pressed="'+LIBERO+'">Pasto libero <span class="v">'+(LIBERO?'usato':'1/sett')+'</span></button>';

  box.querySelectorAll('.mini').forEach(b=>b.addEventListener('click',()=>{
    OGGI.acqua=Math.max(0,Math.min(ACQUA_OBIETTIVO,OGGI.acqua+ +b.dataset.a));
    saveOggi();renderOggi();
  }));
  box.querySelectorAll('button.rem').forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.k;
    if(k==='libero'){LIBERO=!LIBERO;saveLibero();}
    else{OGGI[k]=!OGGI[k];saveOggi();}
    renderOggi();
  }));
}

function seqFor(i){

    Object.assign({kick:'Pranzo · veloce',accent:true},d.pranzo),
    PLAN.spPomeriggio,

function renderDay(i){
  currentDay=i;currentMeal=null;

  content.innerHTML=seq.map((m,mi)=>renderMeal(m,mi,SLOTS[mi].c,i+'-'+mi)).join('');

}

  currentDay=i;currentMeal=m;

  content.innerHTML=renderMeal(seq[m],0,SLOTS[m].c,i+'-'+m);

}

function bloccoCompensa(i){
  if(i!==TODAY) return '';
  const scelti=sgarriDiOggi(), tot=totaleSgarri(), extra=tot.k;
  if(!extra) return '<div class="comp">'+pickerSgarri()+'</div>';

  const rest=[];
  seqFor(i).forEach((m,mi)=>{
    if(DONE.has(i+'-'+mi)) return;
    (m.ing||[]).forEach((ing,ii)=>{
      const k=kcalDi(ing[0],ing[1]);
      if(k) rest.push({key:mi+'-'+ii,nome:ing[0],k:k,pasto:SLOTS[mi].lab});
    });
  });
  rest.sort((a,b)=>b.k-a.k);
  const tolto=rest.filter(r=>TOLTI.has(r.key)).reduce((a,r)=>a+r.k,0);

  let h='<div class="comp"><div class="comp-h"><span>Fuori piano <b>'+extra+' kcal</b></span>'
   +'<button class="linkbtn" type="button" id="azzeraExtra">azzera</button></div>'
   +'<ul class="sg-list">'+scelti.map((s,idx)=>
      '<li><span>'+s.n+'</span><b>'+s.k+' kcal</b>'
      +'<button class="sg-x" type="button" data-del="'+idx+'" aria-label="Togli '+s.n+'">×</button></li>').join('')
   +'</ul>'+pickerSgarri();
  if(!rest.length){
    h+='<div class="comp-n">Non restano pasti da alleggerire oggi.</div>';
  }else{
    h+='<div class="comp-n">Tocca cosa togli dai pasti che restano: <b class="'
      +(tolto>=extra?'ok':'')+'">'+tolto+'</b> di '+extra+' kcal</div>'
      +'<ul class="comp-l">'+rest.slice(0,8).map(r=>
        '<li><button class="comp-i'+(TOLTI.has(r.key)?' on':'')+'" type="button" data-t="'+r.key+'">'
        +'<span>'+r.nome+' <em>'+r.pasto+'</em></span><b>'+r.k+' kcal</b></button></li>').join('')
      +'</ul>';
  }
  return h+'</div>';
}

function renderRecap(i){
  const box=document.getElementById('recap');
  if(!box) return;
  const seq=seqFor(i);
  const prev=macroSomma(seq);
  const fatti=seq.filter((_,m)=>DONE.has(i+'-'+m));
  const mang=macroSomma(fatti);
  // Gli sgarri scelti dal catalogo portano anche i loro macro
  const sg=(i===TODAY?totaleSgarri():{k:0,p:0,c:0,g:0});
  const extra=sg.k;
  // calorie del fuori piano che i macro non spiegano: alcol, o voci senza macro
  const scartoSg=sg.k-(sg.p*4+sg.c*4+sg.g*9);
  // i macro del catalogo hanno decimali: arrotondo qui, non nei dati
  mang.k=Math.round(mang.k+sg.k);mang.p=Math.round(mang.p+sg.p);
  mang.c=Math.round(mang.c+sg.c);mang.g=Math.round(mang.g+sg.g);
  const resta={k:Math.max(0,prev.k-mang.k),p:Math.max(0,prev.p-mang.p),
               c:Math.max(0,prev.c-mang.c),g:Math.max(0,prev.g-mang.g)};
  const riga=(et,f,p,u)=>{
    const perc=p?Math.min(100,f/p*100):0;
    return '<div class="rc-r"><span class="rc-l">'+et+'</span>'
      +'<div class="rc-bar"><i style="width:'+perc.toFixed(1)+'%"></i></div>'
      +'<span class="rc-v"><b>'+f+'</b>/'+p+' '+u+'</span></div>';
  };
  box.innerHTML='<div class="recap"><div class="rc-h">'
    +'<span>'+PLAN.days[i].full+(i===TODAY?' · oggi':'')+'</span>'
    +'<span class="rc-n">'+fatti.length+'/'+seq.length+' pasti segnati</span></div>'
    +riga('kcal',mang.k,prev.k,'')
    +riga('Proteine',mang.p,prev.p,'g')
    +riga('Carbo',mang.c,prev.c,'g')
    +riga('Grassi',mang.g,prev.g,'g')
    +((fatti.length||extra)&&fatti.length<seq.length
      ? '<div class="rc-rest">Restano <b>'+resta.k+' kcal</b> · P '+resta.p+' g · C '+resta.c+' g · G '+resta.g+' g</div>'
      : fatti.length===seq.length
        ? '<div class="rc-rest">Giornata completata.</div>'
        : '<div class="rc-rest">Segna i pasti fatti per vedere cosa manca.</div>')
    +bloccoCompensa(i)
    +'<div class="rc-note">Stime da tabelle di composizione pubbliche, non i calcoli del medico.'
    +(scartoSg>Math.max(40,sg.k*0.15)
      ? ' Di '+Math.round(scartoSg)+' kcal del fuori piano non si sa da quali macro vengano: '
       +'negli alcolici è l’alcol, che non rientra in P/C/G; nelle voci senza macro è ignoto.'
      : '')+'</div>'
    +'</div>';

  const az=document.getElementById('azzeraExtra');
  if(az) az.addEventListener('click',()=>{OGGI.sgarri=[];TOLTI=new Set();saveOggi();renderRecap(i);});
  box.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>{
    OGGI.sgarri=(OGGI.sgarri||[]).concat([b.dataset.add]);saveOggi();renderRecap(i);
  }));
  box.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{
    const a=(OGGI.sgarri||[]).slice();a.splice(+b.dataset.del,1);
    OGGI.sgarri=a;if(!a.length) TOLTI=new Set();
    saveOggi();renderRecap(i);
  }));

  // ricordo quali pannelli erano aperti: il render li ricostruisce da zero
  const pick=box.querySelector('.sg-pick'), form=box.querySelector('.sg-new');
  if(pick) pick.addEventListener('toggle',()=>{PICKER_APERTO=pick.open;});
  if(form) form.addEventListener('toggle',()=>{FORM_APERTO=form.open;});

  const salva=document.getElementById('salvaMio');
  if(salva) salva.addEventListener('click',()=>{
    const msg=document.getElementById('mioMsg');
    // accetto sia la virgola sia il punto, e tengo un decimale
    const num=id=>{const v=parseFloat((document.getElementById(id).value||'').replace(',','.'));
                   return isFinite(v)&&v>0?Math.min(5000,Math.round(v*10)/10):0;};
    const n=(document.getElementById('mioN').value||'').trim();
    const k=num('mioK');
    if(!n){msg.innerHTML='<div class="msg err">Serve un nome.</div>';return;}
    if(!(k>0)){msg.innerHTML='<div class="msg err">Servono le kcal della porzione.</div>';return;}
    if(MIEI.length>=40){msg.innerHTML='<div class="msg err">Hai già 40 voci: eliminane una.</div>';return;}
    MIEI.push({id:'mio'+Date.now(),n:n,k:Math.round(k),p:num('mioP'),c:num('mioC'),g:num('mioG')});
    saveMiei();
    PICKER_APERTO=true;FORM_APERTO=true;
    renderRecap(i);
    const m2=document.getElementById('mioMsg');
    if(m2) m2.innerHTML='<div class="msg ok">Voce salvata: la trovi in “Tue voci”.</div>';
  });
  box.querySelectorAll('[data-delmio]').forEach(b=>b.addEventListener('click',()=>{
    const id=b.dataset.delmio;
    const usata=(OGGI.sgarri||[]).indexOf(id)>=0;
    if(!confirm('Eliminare questa voce?'+(usata?' L’hai usata oggi: verrà tolta anche dal conteggio.':''))) return;
    if(usata) OGGI.sgarri=(OGGI.sgarri||[]).filter(x=>x!==id),saveOggi();
    MIEI=MIEI.filter(m=>m.id!==id);saveMiei();
    PICKER_APERTO=true;FORM_APERTO=true;renderRecap(i);
  }));
  box.querySelectorAll('.comp-i').forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.t;
    TOLTI.has(k)?TOLTI.delete(k):TOLTI.add(k);
    renderRecap(i);
  }));
}

// Settimane archiviate + quella in corso, con il pasto piu' saltato:
// e' quello che serve portare al controllo dal medico.
// L'API moderna richiede contesto sicuro e gesto dell'utente: se viene negata
// si ripiega sulla vecchia execCommand, che funziona anche li'.
async function copiaTesto(t){
  try{await navigator.clipboard.writeText(t);return true;}catch(e){}
  try{
    const ta=document.createElement('textarea');
    ta.value=t;ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;top:-1000px;opacity:0';
    document.body.appendChild(ta);ta.select();
    const ok=document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){return false;}
}

function bloccoAderenza(){
  const st=loadStorico().slice();
  const perOra=[0,0,0,0,0];
  DONE.forEach(k=>{const m=+String(k).split('-')[1];if(perOra[m]!==undefined)perOra[m]++;});
  const righe=st.concat([{w:SETTIMANA,n:DONE.size,tot:35,per:perOra,ora:true}]);
  if(righe.length===1&&!DONE.size)
    return '<div class="card"><div class="kick">Aderenza</div>'
      +'<div class="mtitle">Quanto stai seguendo il piano</div>'
      +'<div class="liberi">Da qui in avanti ogni settimana viene archiviata: segna i pasti fatti e '
      +'fra qualche settimana avrai un quadro da mostrare al medico.</div></div>';

  const ultime=righe.slice(-8);
  const media=Math.round(righe.reduce((a,r)=>a+r.n/r.tot,0)/righe.length*100);
  // il piu' saltato: confronto i mancati per fascia sul totale delle settimane
  const mancati=[0,0,0,0,0];
  righe.forEach(r=>r.per.forEach((c,m)=>{mancati[m]+=7-c;}));
  const peggio=mancati.indexOf(Math.max.apply(null,mancati));
  const nomiFascia=['la colazione','lo spuntino del mattino','il pranzo','lo spuntino del pomeriggio','la cena'];

  let h='<div class="card"><div class="kick">Aderenza</div>'
   +'<div class="mtitle">Quanto stai seguendo il piano</div><div class="aderenza">';
  ultime.forEach(r=>{
    const p=Math.round(r.n/r.tot*100);
    h+='<div class="ad-r"><span class="ad-w">'+r.w.replace(/^\d+-W/,'sett. ')+(r.ora?' · in corso':'')+'</span>'
      +'<div class="ad-bar"><i style="width:'+p+'%"></i></div>'
      +'<span class="ad-v"><b>'+p+'%</b> '+r.n+'/'+r.tot+'</span></div>';
  });
  h+='</div><div class="liberi">Media <b>'+media+'%</b> su '+righe.length
    +(righe.length===1?' settimana':' settimane')+'. Il pasto che salti più spesso è <b>'+nomiFascia[peggio]+'</b>.</div>';
  h+='<div class="btnrow"><button class="btn" type="button" id="copiaAderenza">Copia il riepilogo</button></div>';
  return h+'</div>';
}

  }));
}

const SEZIONI=[['sett','Settimana'],['ric','Ricette'],['prep','Prep'],['piano','Piano']];

function setSection(s){
  currentSection=s;
  gridWrap.hidden=(s!=='sett');
  [...seg.children].forEach(b=>b.setAttribute('aria-selected',b.dataset.s===s));
  if(s==='sett') currentMeal===null?renderDay(currentDay):renderPasto(currentDay,currentMeal);
  else if(s==='ric') renderRicette();
  else if(s==='prep') renderPrep();
  else if(s==='piano') renderPiano();
  paintGrid();
}

function buildRail(){
  seg.innerHTML='';
  SEZIONI.forEach(([id,lab])=>{
    const b=document.createElement('button');
    b.type='button';b.dataset.s=id;b.textContent=lab;b.setAttribute('role','tab');
    b.setAttribute('aria-selected',id===currentSection);
    b.addEventListener('click',()=>setSection(id));
    seg.appendChild(b);
  });

  grid.innerHTML='';
  const corner=document.createElement('div');grid.appendChild(corner);
  PLAN.days.forEach((d,i)=>{
    const h=document.createElement('button');
    h.type='button';h.className='ghead';h.dataset.d=i;h.textContent=d.name;
    h.title='Tutta la giornata di '+d.full;
    h.addEventListener('click',()=>{setSection('sett');renderDay(i);});
    grid.appendChild(h);
  });
  SLOTS.forEach((sl,m)=>{
    const rh=document.createElement('div');rh.className='grow'+(sl.fisso?' fisso':'');
    rh.textContent=sl.lab;
    if(sl.fisso) rh.title='Uguale tutti i giorni';
    grid.appendChild(rh);
    PLAN.days.forEach((d,i)=>{
      const c=document.createElement('button');
      c.type='button';c.className='cell'+(sl.fisso?' fisso':'')+(i===TODAY?' today':'');
      c.style.setProperty('--c',sl.c);
      c.dataset.d=i;c.dataset.m=m;
      const pasto=seqFor(i)[m];
      if(pasto&&pasto.prep){c.classList.add('prep');c.title='Richiede un cereale cotto in anticipo';}
      c.setAttribute('aria-label',sl.lab+' di '+d.full+(pasto&&pasto.prep?' — richiede preparazione in anticipo':''));
      c.addEventListener('click',()=>{setSection('sett');renderPasto(i,m);});
      grid.appendChild(c);
    });
  });
  paintGrid();
}

function planJsonString(){return JSON.stringify(PLAN,null,2);}

async function loadPdfJs(){
  if(window.pdfjsLib) return window.pdfjsLib;
  await new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.js';
    s.onload=res;s.onerror=()=>rej(new Error('Impossibile caricare il lettore PDF: serve connessione internet la prima volta.'));
    document.head.appendChild(s);
  });
  window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.js';
  return window.pdfjsLib;
}

async function extractPdfText(file){
  const pdfjsLib=await loadPdfJs();
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  let text='';
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const tc=await page.getTextContent();
    text+=tc.items.map(it=>it.str).join(' ')+'\n\n';
  }
  return text.trim();
}

function renderPiano(){
  heroDay.textContent='Piano';
  let h='<div class="day-label">Cambia il piano alimentare</div>';

  h+='<div class="card"><div class="kick">PDF</div><div class="mtitle">Estrai testo da un PDF</div>';
  h+='<div class="liberi">Carica il PDF del medico per leggerne il testo qui sotto: copia i valori che ti servono e incollali nel JSON del piano qui sotto. Il parsing automatico dei grammi non è affidabile su PDF con layout diversi, quindi va sempre controllato a mano. Serve connessione internet solo la prima volta (scarica il lettore PDF).</div>';
  h+='<div class="btnrow"><label class="btn">Scegli PDF<input type="file" id="pdfFile" accept="application/pdf" hidden></label></div>';
  h+='<div id="pdfMsg"></div>';
  h+='<div class="pdftext" id="pdfText" hidden></div>';
  h+='</div>';

  h+='<div class="card accent"><div class="kick">Editor</div><div class="mtitle">Piano in formato JSON</div>';
  h+='<div class="liberi">Modifica i valori qui sotto (o incolla/importa un piano esportato in precedenza) e premi <b>Applica modifiche</b>. Resta salvato su questo dispositivo, senza bisogno di toccare il codice dell’app.</div>';
  h+='<textarea class="field" id="planEditor" rows="14" spellcheck="false">'+planJsonString()+'</textarea>';
  h+='<div class="btnrow">';
  h+='<button class="btn primary" id="applyBtn">Applica modifiche</button>';
  h+='<button class="btn" id="exportBtn">Esporta JSON</button>';
  h+='<label class="btn">Importa file JSON<input type="file" id="jsonFile" accept="application/json" hidden></label>';
  h+='<button class="btn" id="resetBtn">Ripristina piano originale</button>';
  h+='</div>';
  h+='<div id="planMsg"></div>';
  h+='</div>';

  content.innerHTML=h;
  content.classList.remove('fade');void content.offsetWidth;content.classList.add('fade');

  const pdfMsg=document.getElementById('pdfMsg');
  const pdfText=document.getElementById('pdfText');
  document.getElementById('pdfFile').addEventListener('change',async (e)=>{
    const file=e.target.files[0];
    if(!file) return;
    pdfMsg.innerHTML='<div class="msg">Lettura in corso…</div>';
    pdfText.hidden=true;
    try{
      const text=await extractPdfText(file);
      pdfText.textContent=text||'(nessun testo trovato — il PDF potrebbe essere una scansione/immagine)';
      pdfText.hidden=false;
      pdfMsg.innerHTML='<div class="msg ok">Testo estratto. Copia i valori che ti servono nel JSON qui sotto.</div>';
    }catch(err){
      pdfMsg.innerHTML='<div class="msg err">'+(err&&err.message?err.message:'Errore nella lettura del PDF.')+'</div>';
    }
  });

  const planMsg=document.getElementById('planMsg');
  const planEditor=document.getElementById('planEditor');

  document.getElementById('applyBtn').addEventListener('click',()=>{
    let parsed;
    try{ parsed=JSON.parse(planEditor.value); }
    catch(e){ planMsg.innerHTML='<div class="msg err">JSON non valido: '+e.message+'</div>'; return; }
    const err=validatePlan(parsed);
    if(err){ planMsg.innerHTML='<div class="msg err">'+err+'</div>'; return; }
    PLAN=parsed;
    try{localStorage.setItem(PLAN_KEY,JSON.stringify(PLAN));}catch(e){}
    planMsg.innerHTML='<div class="msg ok">Piano applicato e salvato su questo dispositivo. Tocca un giorno per vederlo.</div>';
    buildRail();
    });

  document.getElementById('exportBtn').addEventListener('click',()=>{
    const blob=new Blob([planJsonString()],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='piano11.json';a.click();
    URL.revokeObjectURL(url);
  });

  document.getElementById('jsonFile').addEventListener('change',(e)=>{
    const file=e.target.files[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{ planEditor.value=reader.result; };
    reader.readAsText(file);
  });

  document.getElementById('resetBtn').addEventListener('click',()=>{
    if(!confirm('Ripristinare il piano originale? Le modifiche correnti andranno perse.')) return;
    try{localStorage.removeItem(PLAN_KEY);}catch(e){}
    PLAN=clonePlan(DEFAULT_PLAN);
    buildRail();
    renderPiano();
    const m=document.getElementById('planMsg');
    if(m) m.innerHTML='<div class="msg ok">Piano originale ripristinato.</div>';
  });
}

// ---- Popup sostituzioni ----
const sheetBg=document.getElementById('sheetBg');
const sheetBody=document.getElementById('sheetBody');
const sheetTitle=document.getElementById('sheetTitle');
const tabDoc=document.getElementById('tabDoc');
const tabWeb=document.getElementById('tabWeb');
let sheetData=null, lastFocus=null, hideTimer=null;

function subRows(list){
  return list.map(s=>'<div class="sub"><div class="sn">'+s.nome+(s.nota?'<i>'+s.nota+'</i>':'')+'</div><div class="sq">'+s.qty+'</div></div>').join('');
}
function paintSheet(which){
  const isDoc=which==='doc';
  tabDoc.setAttribute('aria-selected',isDoc);
  tabWeb.setAttribute('aria-selected',!isDoc);
  const list=isDoc?sheetData.occhino:sheetData.web;
  if(!list.length){
    sheetBody.innerHTML='<div class="sheet-empty">'+(isDoc
      ? 'Il piano non indica sostituzioni per questo alimento. Guarda la scheda <b>Alternative</b> per equivalenze indicative.'
      : 'Nessuna alternativa disponibile per questo alimento.')+'</div>';
    return;
  }
  sheetBody.innerHTML=subRows(list)+(isDoc
    ? '<div class="sheet-note">Sostituzioni indicate nel piano del <b>Dott. Salvatore Occhino</b>: mantengono i macro previsti.</div>'
    : '<div class="sheet-note"><b>Non fanno parte del piano.</b> Sono equivalenze indicative da tabelle nutrizionali pubbliche, arrotondate a 5 g: usale come ripiego e verificale con il medico prima di renderle abituali.</div>');
}
function openSheet(mi,idx){
  const meal=CURRENT_SEQ[mi];
  if(!meal) return;
  sheetData=subsFor(meal,idx);
  sheetTitle.innerHTML=sheetData.nome+' <em>'+sheetData.qty+'</em>';
  paintSheet(sheetData.occhino.length?'doc':'web');
  lastFocus=document.activeElement;
  if(hideTimer){clearTimeout(hideTimer);hideTimer=null;} // annulla una chiusura ancora in corso
  sheetBg.hidden=false;
  void sheetBg.offsetWidth; // reflow sincrono: non dipende da rAF, che non scatta a tab nascosta
  sheetBg.classList.add('open');
  document.body.style.overflow='hidden';
  document.getElementById('sheetX').focus();
}
function closeSheet(){
  if(sheetBg.hidden) return;
  sheetBg.classList.remove('open');
  document.body.style.overflow='';
  if(hideTimer) clearTimeout(hideTimer);
  hideTimer=setTimeout(()=>{sheetBg.hidden=true;hideTimer=null;},220);
  if(lastFocus&&lastFocus.focus) lastFocus.focus();
}
content.addEventListener('click',e=>{
  const b=e.target.closest('button.chip');
  if(b){openSheet(+b.dataset.m,+b.dataset.i);return;}
  const f=e.target.closest('.donebtn');
  if(f){
    const s=f.dataset.slot;
    DONE.has(s)?DONE.delete(s):DONE.add(s);
    saveDone();
    f.classList.toggle('on',DONE.has(s));
    f.setAttribute('aria-pressed',DONE.has(s));
    f.textContent=DONE.has(s)?'Fatto':'Segna come fatto';
    paintGrid();
  }
});
tabDoc.addEventListener('click',()=>paintSheet('doc'));
tabWeb.addEventListener('click',()=>paintSheet('web'));
document.getElementById('sheetX').addEventListener('click',closeSheet);
sheetBg.addEventListener('click',e=>{if(e.target===sheetBg) closeSheet();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!sheetBg.hidden) closeSheet();});

// Swipe orizzontale tra i giorni, solo dentro la Settimana
let tsx=0,tsy=0;
content.addEventListener('touchstart',e=>{const t=e.changedTouches[0];tsx=t.clientX;tsy=t.clientY;},{passive:true});
content.addEventListener('touchend',e=>{
  if(currentSection!=='sett') return;
  const t=e.changedTouches[0];
  const dx=t.clientX-tsx, dy=t.clientY-tsy;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.6) selectDay(currentDay+(dx<0?1:-1));
},{passive:true});

// Frecce: orizzontali cambiano giorno, verticali cambiano fascia di pasto
grid.addEventListener('keydown',e=>{
  const k=e.key;
  if(k!=='ArrowRight'&&k!=='ArrowLeft'&&k!=='ArrowUp'&&k!=='ArrowDown') return;
  e.preventDefault();
  if(k==='ArrowRight'||k==='ArrowLeft') selectDay(currentDay+(k==='ArrowRight'?1:-1));
  else{
    const m=currentMeal===null?(k==='ArrowDown'?0:SLOTS.length-1)
                              :Math.max(0,Math.min(SLOTS.length-1,currentMeal+(k==='ArrowDown'?1:-1)));
    renderPasto(currentDay,m);
  }
  const sel=grid.querySelector('.cell[aria-selected="true"]');
  if(sel) sel.focus();
});

const now=new Date();
heroDate.textContent=now.getDate()+' '+MESI[now.getMonth()]+' '+now.getFullYear();
const map={1:0,2:1,3:2,4:3,5:4,6:5,0:6};
const TODAY=map[now.getDay()]??0;
currentDay=TODAY;
buildRail();
renderOggi();
renderDay(TODAY);

if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});}
