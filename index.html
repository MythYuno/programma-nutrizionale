<!DOCTYPE html>
<html lang="it" data-theme="grafite">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Piano 11</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Piano 11">
<meta name="theme-color" content="#0B0D11">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0B0D11;--text:#ECEEF1;--text-dim:#9AA0A9;--text-faint:#666C75;
    --glass:rgba(255,255,255,.045);--glass-2:rgba(255,255,255,.07);
    --stroke:rgba(255,255,255,.09);--stroke-2:rgba(255,255,255,.16);
    --accent:#BDCAD9;--accent-ink:#0B0D11;--accent-soft:rgba(189,202,217,.14);
    --bloom:rgba(120,150,200,.16);--radius:20px;
  }
  html[data-theme="brace"]{--accent:#FF8E78;--accent-ink:#1A0C08;--accent-soft:rgba(255,142,120,.15);--bloom:rgba(255,120,90,.16);}
  html[data-theme="indaco"]{--accent:#AAB1FF;--accent-ink:#0B0C1A;--accent-soft:rgba(170,177,255,.16);--bloom:rgba(130,140,255,.18);}

  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Geist',-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100dvh;overflow-x:hidden;
    padding-bottom:calc(56px + env(safe-area-inset-bottom));
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(60% 50% at 18% 8%,var(--bloom),transparent 70%),
               radial-gradient(55% 45% at 92% 100%,var(--bloom),transparent 72%);
    transition:background .5s ease;
  }
  ::selection{background:var(--accent);color:var(--accent-ink)}
  .wrap{max-width:660px;margin:0 auto;padding:0 18px}

  .topbar{position:sticky;top:0;z-index:30;padding:calc(env(safe-area-inset-top) + 12px) 0 12px;
    background:linear-gradient(var(--bg) 70%,rgba(11,13,17,0))}
  .topbar-inner{max-width:660px;margin:0 auto;padding:0 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:baseline;gap:8px}
  .brand b{font-weight:600;font-size:17px;letter-spacing:-.01em}
  .brand .n{font-family:'Geist Mono',monospace;font-size:13px;color:var(--accent);
    background:var(--accent-soft);border:1px solid var(--stroke);padding:2px 7px;border-radius:7px}
  .swatches{display:flex;gap:8px}
  .sw{width:22px;height:22px;border-radius:50%;cursor:pointer;border:1.5px solid var(--stroke-2);padding:0;position:relative;transition:transform .15s ease}
  .sw:active{transform:scale(.9)}
  .sw[data-t="grafite"]{background:#BDCAD9}
  .sw[data-t="brace"]{background:#FF8E78}
  .sw[data-t="indaco"]{background:#AAB1FF}
  .sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px currentColor}
  .sw[data-t="grafite"][aria-pressed="true"]{color:#BDCAD9}
  .sw[data-t="brace"][aria-pressed="true"]{color:#FF8E78}
  .sw[data-t="indaco"][aria-pressed="true"]{color:#AAB1FF}
  .sw:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  .hero{padding:18px 0 6px}
  .hero .ey{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
  .hero h1{font-weight:600;font-size:clamp(34px,10vw,52px);line-height:.98;letter-spacing:-.03em}
  .hero .date{color:var(--text-dim);font-size:14px;margin-top:10px}
  .reminders{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}
  .rem{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-dim);
    background:var(--glass);border:1px solid var(--stroke);border-radius:100px;padding:6px 12px;
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  .rem .v{font-family:'Geist Mono',monospace;color:var(--text);font-size:12px}
  .rem i{width:5px;height:5px;border-radius:50%;background:var(--accent);font-style:normal}

  .rail-shell{position:sticky;top:calc(env(safe-area-inset-top) + 56px);z-index:25;padding:14px 0 10px;
    background:linear-gradient(var(--bg) 74%,rgba(11,13,17,0))}
  .rail{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:0 18px;max-width:660px;margin:0 auto;-webkit-overflow-scrolling:touch}
  .rail::-webkit-scrollbar{display:none}
  .dchip{flex:0 0 auto;font-weight:500;font-size:14px;color:var(--text-dim);background:var(--glass);
    border:1px solid var(--stroke);border-radius:12px;padding:10px 15px;cursor:pointer;white-space:nowrap;transition:.16s ease;
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  .dchip:hover{color:var(--text);border-color:var(--stroke-2)}
  .dchip[aria-selected="true"]{color:var(--accent-ink);background:var(--accent);border-color:var(--accent);font-weight:600}
  .dchip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .day-label{font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--text-faint);margin:10px 0 16px;display:flex;align-items:center;gap:12px}
  .day-label::after{content:"";flex:1;height:1px;background:var(--stroke)}

  .card{background:var(--glass);border:1px solid var(--stroke);border-radius:var(--radius);padding:22px 20px;margin-bottom:16px;
    -webkit-backdrop-filter:blur(22px) saturate(1.3);backdrop-filter:blur(22px) saturate(1.3);position:relative}
  .card .meal-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
  .kick{font-family:'Geist Mono',monospace;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:10px;color:var(--text-faint)}
  .card.accent .kick{color:var(--accent)}
  .mtitle{font-weight:600;font-size:22px;letter-spacing:-.015em;line-height:1.12}
  .timepill{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;margin-top:2px;font-family:'Geist Mono',monospace;font-size:13px;
    color:var(--accent);background:var(--accent-soft);border:1px solid var(--stroke-2);border-radius:9px;padding:5px 9px}
  .timepill svg{width:12px;height:12px}

  .ing{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0 2px}
  .chip{display:inline-flex;align-items:baseline;gap:7px;font-size:13.5px;background:var(--glass-2);
    border:1px solid var(--stroke);border-radius:9px;padding:6px 10px}
  .chip .g{font-family:'Geist Mono',monospace;font-size:12.5px;color:var(--accent);font-weight:500}

  .liberi{font-size:12.5px;color:var(--text-faint);margin-top:11px}
  .liberi b{color:var(--text-dim);font-weight:500}
  .oppure{font-size:12.5px;color:var(--text-dim);margin-top:11px;padding-left:13px;border-left:2px solid var(--stroke)}
  .oppure span{display:block;font-family:'Geist Mono',monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint);margin-bottom:3px}

  .alts{margin-top:16px;padding-top:14px;border-top:1px solid var(--stroke)}
  .alts>span{display:block;font-family:'Geist Mono',monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint);margin-bottom:10px}
  .alts ul{list-style:none}
  .alts li{position:relative;padding:0 0 9px 16px;font-size:13.5px;color:var(--text-dim)}
  .alts li:last-child{padding-bottom:0}
  .alts li::before{content:"";position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:var(--accent)}

  ol.steps{list-style:none;counter-reset:s;margin-top:18px}
  ol.steps li{counter-increment:s;position:relative;padding:0 0 13px 34px;font-size:14.5px;color:var(--text)}
  ol.steps li:last-child{padding-bottom:0}
  ol.steps li::before{content:counter(s);position:absolute;left:0;top:-1px;width:22px;height:22px;border-radius:7px;
    font-family:'Geist Mono',monospace;font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:center;
    color:var(--text-dim);background:var(--glass-2);border:1px solid var(--stroke)}

  .tip{margin-top:18px;display:flex;gap:11px;background:var(--accent-soft);border:1px solid var(--stroke-2);
    border-radius:13px;padding:13px 15px;font-size:13.5px;color:var(--text)}
  .tip svg{width:16px;height:16px;flex:0 0 auto;margin-top:2px;color:var(--accent)}
  .tip b{color:var(--accent);font-weight:600}

  .field{width:100%;margin-top:10px;background:var(--glass-2);border:1px solid var(--stroke);border-radius:13px;
    padding:12px 14px;color:var(--text);font-family:'Geist Mono',monospace;font-size:12.5px;line-height:1.5;resize:vertical}
  .field:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .btn{font-family:'Geist',sans-serif;font-weight:600;font-size:13.5px;border-radius:11px;padding:10px 16px;
    cursor:pointer;border:1px solid var(--stroke-2);background:var(--glass-2);color:var(--text);transition:.15s ease;display:inline-flex;align-items:center}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .msg{margin-top:12px;font-size:12.5px;border-radius:10px;padding:9px 12px}
  .msg.ok{background:rgba(120,200,140,.12);color:#9fe3b0;border:1px solid rgba(120,200,140,.3)}
  .msg.err{background:rgba(220,90,90,.12);color:#f3a3a3;border:1px solid rgba(220,90,90,.3)}
  .pdftext{margin-top:10px;max-height:220px;overflow:auto;white-space:pre-wrap;font-family:'Geist Mono',monospace;
    font-size:11.5px;color:var(--text-dim);background:var(--glass-2);border:1px solid var(--stroke);border-radius:13px;padding:12px 14px}

  .shop{list-style:none;margin-top:2px}
  .shop li{display:flex;align-items:center;gap:11px;padding:9px 2px;font-size:14px;color:var(--text);
    cursor:pointer;border-bottom:1px solid var(--stroke);-webkit-tap-highlight-color:transparent}
  .shop li:last-child{border-bottom:none}
  .shop li .box{flex:0 0 auto;width:19px;height:19px;border-radius:6px;border:1.5px solid var(--stroke-2);
    display:flex;align-items:center;justify-content:center;transition:.15s ease}
  .shop li.on{color:var(--text-faint);text-decoration:line-through}
  .shop li.on .box{background:var(--accent);border-color:var(--accent)}
  .shop li.on .box::after{content:"";width:5px;height:9px;border:solid var(--accent-ink);border-width:0 2px 2px 0;
    transform:rotate(45deg) translateY(-1px)}

  footer{margin-top:28px;padding-top:22px;border-top:1px solid var(--stroke);color:var(--text-faint);font-size:12.5px}
  footer .lk{display:flex;align-items:center;gap:8px;color:var(--text-dim);margin-bottom:8px}
  footer .lk svg{width:13px;height:13px;color:var(--accent)}
  footer .mt{font-family:'Geist Mono',monospace;font-size:11px}

  .fade{animation:fade .28s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand"><b>Piano</b><span class="n">11</span></div>
    <div class="swatches" role="group" aria-label="Tema colore">
      <button class="sw" data-t="grafite" aria-pressed="true" aria-label="Tema Grafite"></button>
      <button class="sw" data-t="brace" aria-pressed="false" aria-label="Tema Brace"></button>
      <button class="sw" data-t="indaco" aria-pressed="false" aria-label="Tema Indaco"></button>
    </div>
  </div>
</div>

<div class="wrap">
  <section class="hero">
    <div class="ey">Ricette · macro bloccate</div>
    <h1 id="heroDay">Lunedì</h1>
    <div class="date" id="heroDate"></div>
    <div class="reminders">
      <span class="rem"><i></i>Acqua <span class="v">3–3,5 L</span></span>
      <span class="rem"><i></i>Creatina <span class="v">5 g</span></span>
      <span class="rem"><i></i>Omega-3 <span class="v">1 g</span></span>
      <span class="rem"><i></i>Libero <span class="v">1/sett</span></span>
    </div>
  </section>
</div>

<div class="rail-shell">
  <div class="rail" id="rail" role="tablist" aria-label="Giorni"></div>
</div>

<div class="wrap">
  <main id="content"></main>
  <footer>
    <div class="lk">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      Colazione e spuntini sono uguali ogni giorno. Condimenti liberi non spostano i macro.
    </div>
    <div class="mt">Dott. Salvatore Occhino · 22/04/2026 · sale moderato salvo dove indicato “no sale”.</div>
  </footer>
</div>

<script>
const clock='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
const bolt='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>';

const COLAZIONE={kick:'Colazione',title:'Latte e cereali',
  ing:[['Latte p.s.','200 g'],['Cereali','50 g'],['Cioccolato fondente','10 g']],
  oppure:'Latte → Kefir 150 g · Yogurt 2% 150 g · Yogurt intero 125 g  ·  Cereali → Corn Flakes 40 g · Muesli 45 g · Frollini 40 g · Avena 40 g',
  altsTitle:'Colazioni alternative',
  alts:['Pancake: 1 uovo + 40 g farina + latte q.b., con 10 g marmellata o crema cacao',
    'Porridge cotto: 100 g latte + 50 g farina, cioccolato fondente sopra',
    'Panino 80 g con 10 g formaggio molle + 30 g affettato (o 50 g mozzarella e pomodoro)',
    '2 uova + 60 g di pane o pan bauletto']};

const SP_MATTINO={kick:'Spuntino · mattino',title:'Frutta e frutta secca',
  ing:[['Frutta fresca','150 g'],['Frutta secca/oleosa','30 g']],
  liberi:'Un frutto medio va benissimo.'};

const SP_POMERIGGIO={kick:'Spuntino · pomeriggio',title:'Spuntino salato',
  ing:[['Crackers','50 g']],
  oppure:'Crackers → Pan Bauletto bianco 60 g · Grissini 50 g · Biscotti 40 g',
  liberi:'+ 20 g di marmellata solo se ti alleni.'};

const DAYS=[
 {id:'lun',name:'Lun',full:'Lunedì',
  pranzo:{title:'Pasta caprese',time:'~10 min',
   ing:[['Pasta di semola','110 g'],['Mozzarella','100 g'],['Pomodori','100 g'],['Olio EVO','5 g']],
   liberi:'Basilico, origano, pepe.',
   steps:['Metti su l’acqua e cuoci la pasta al dente.','Intanto taglia mozzarella e pomodori a cubetti e condisci con l’olio, basilico e pepe.','Scola, lascia intiepidire un minuto e manteca. Origano a chiudere.'],
   tip:'Cuoci <b>220 g</b> di pasta in un colpo: metà in frigo con un filo d’olio → domani pasta fredda pronta in 60 secondi.'},
  cena:{title:'Pollo arrosto, verdure e pane',
   ing:[['Pollo','250 g'],['Verdure','150 g'],['Olio EVO','10 g'],['Pane integrale','100 g']],
   oppure:'Coscia 300 g (con osso) · pane → Patate 300 g o Cous cous 70 g',
   liberi:'Paprika, rosmarino, aglio, limone.',
   steps:['Marina il pollo 5 min con limone, paprika, rosmarino e aglio.','Cuoci in padella o forno a 200° finché dorato (15–18 min).','Arrostisci le verdure con metà olio; il resto a crudo. Pane a parte.'],
   tip:'Cuoci una porzione di pollo in più: la coscia avanzata diventa proteina già pronta per un pranzo extra in settimana.'}},

 {id:'mar',name:'Mar',full:'Martedì',
  pranzo:{title:'Insalata di orzo e tonno',time:'~5 min',
   ing:[['Orzo','100 g'],['Tonno sgocciolato','50 g'],['Verdure','200 g'],['Olio EVO','5 g']],
   liberi:'Limone e spezie — <b>no sale</b> (c’è il tonno).',
   oppure:'Orzo → Riso 100 g · verdure: zucchine, melanzane, broccoli, cavolfiore, cavoletti',
   steps:['Sgocciola bene il tonno e usa l’orzo già cotto (vedi tip).','Aggiungi le verdure: ottime anche surgelate ripassate o lessate.','Unisci a freddo con olio, limone e spezie. Niente sale.'],
   tip:'Lessa <b>300 g di orzo</b> a inizio settimana e porziona: assembli in 2 minuti.'},
  cena:{title:'Frittata di verdure, pane e insalata',
   ing:[['Uova (3)','150 g'],['Pane integrale','130 g'],['Verdure crude','150 g'],['Olio EVO','10 g']],
   oppure:'Uova → Gamberetti 300 g · pane → Patate 380 g',
   liberi:'Pomodori, carote, iceberg a crudo. Sale moderato, pepe.',
   steps:['Sbatti le uova con pepe e poco sale.','Cuoci la frittata a fuoco medio con parte dell’olio (con un po’ di verdura dentro se vuoi).','Servi con pane e insalata cruda condita con l’olio rimasto e limone.'],
   tip:'Usa le verdure già lavate e tagliate per il pranzo di domani (vedi tip orzo): frittata pronta in 8 minuti.'}},

 {id:'mer',name:'Mer',full:'Mercoledì',
  pranzo:{title:'Farro e lenticchie tiepido',time:'~4 min',
   ing:[['Farro','100 g'],['Lenticchie scatola','250 g'],['Verdure','150 g'],['Grana','10 g'],['Olio EVO','5 g'],['Frutta','150 g']],
   oppure:'Farro → Riso 101 g · lenticchie scatola → 70 g secche',
   liberi:'Spezie, prezzemolo.',
   steps:['Sciacqua le lenticchie in scatola per togliere il sale in eccesso.','Usa il farro già cotto, unisci lenticchie e verdure.','Condisci con olio e spezie, grana sopra. Frutta a chiudere.'],
   tip:'Farro <b>batch-cooked</b> + lenticchie in vetro = piatto freddo o tiepido in 3–4 minuti.'},
  cena:{title:'Manzo magro alla griglia',
   ing:[['Manzo magro','200 g'],['Pane integrale','130 g'],['Verdure','150 g'],['Olio EVO','10 g']],
   oppure:'Manzo → Pollo 230 g · Pesce azzurro 200 g · Cavallo 225 g · Feta 102 g · pane → Patate 380 g',
   liberi:'Rosmarino, pepe.',
   steps:['Scalda bene una piastra o padella.','Cuoci la carne 2–3 min per lato secondo lo spessore; sala dopo la cottura.','Verdure grigliate o crude con l’olio; pane a parte.'],
   tip:'Non serve marinare: bastano 2–3 minuti per lato a fuoco alto. Sala solo a fine cottura per non far perdere succosità.'}},

 {id:'gio',name:'Gio',full:'Giovedì',
  pranzo:{title:'Riso freddo con feta e verdure',time:'~4 min',
   ing:[['Riso','110 g'],['Feta','60 g'],['Verdure','100 g'],['Olio EVO','5 g']],
   liberi:'Menta, limone, spezie — <b>no sale</b> (c’è la feta).',
   oppure:'Feta → Formaggio molle 40 g o Ricotta 80 g · verdure: zucchine, melanzane, broccoli, cavolfiore',
   steps:['Usa il riso freddo già cotto.','Sbriciola la feta e unisci le verdure (grigliate o surgelate ripassate).','Condisci con olio, limone e menta. Niente sale.'],
   tip:'Cuoci <b>2–3 porzioni di riso</b> e tienile in frigo: si monta a freddo in pochi minuti.'},
  cena:{title:'Merluzzo al forno con cous cous',
   ing:[['Cous cous','100 g'],['Merluzzo','300 g'],['Verdure','150 g'],['Olio EVO','10 g']],
   oppure:'Cous cous → Riso 100 g · Merluzzo → Pesce azzurro 145 g · Salmone affumicato 135 g · Uova 150 g (3) · Tofu 253 g + salsa soia 10 g',
   liberi:'Limone, prezzemolo, aglio.',
   steps:['Idrata il cous cous con pari volume d’acqua bollente, coperto 5 min, poi sgrana.','Cuoci il merluzzo al forno o in padella con limone ed erbe (8–10 min).','Verdure di contorno; chiudi con l’olio a crudo.'],
   tip:'Tieni filetti di merluzzo surgelati in monoporzione: si cuociono in forno direttamente da congelati, bastano 5 minuti in più.'}},

 {id:'ven',name:'Ven',full:'Venerdì',
  pranzo:{title:'Pasta e ceci',time:'~12 min',
   ing:[['Pasta di semola','100 g'],['Ceci scatola','140 g'],['Olio EVO','5 g'],['Frutta','150 g']],
   oppure:'Ceci → 60 g secchi · oppure Fagioli 160 g scatola / 60 g secchi',
   liberi:'Rosmarino, aglio, pepe.',
   steps:['Sciacqua i ceci. Soffriggi appena aglio e rosmarino nell’olio.','Cuoci la pasta; unisci i ceci (frullane una parte per cremosità, se ti va).','Manteca con un po’ d’acqua di cottura. Frutta dopo.'],
   tip:'Versione fredda: pasta corta cotta prima + ceci in scatola a crudo → <b>4 minuti</b>.'},
  cena:{title:'Salmone al forno, patate e verdure',
   ing:[['Patate','400 g'],['Salmone','120 g'],['Olio EVO','10 g'],['Verdure','150 g']],

const DEFAULT_PLAN={colazione:COLAZIONE,spMattino:SP_MATTINO,spPomeriggio:SP_POMERIGGIO,days:DAYS};
const PLAN_KEY='piano11-plan-v1';

function clonePlan(p){return JSON.parse(JSON.stringify(p));}

function validatePlan(p){
  if(!p||typeof p!=='object') return 'Il piano deve essere un oggetto JSON valido.';
  if(!p.colazione||!Array.isArray(p.colazione.ing)) return 'Manca "colazione" con un array "ing".';
  if(!p.spMattino||!Array.isArray(p.spMattino.ing)) return 'Manca "spMattino" con un array "ing".';
  if(!p.spPomeriggio||!Array.isArray(p.spPomeriggio.ing)) return 'Manca "spPomeriggio" con un array "ing".';
  if(!Array.isArray(p.days)||p.days.length!==7) return '"days" deve essere un array di 7 giorni.';
  for(const d of p.days){
    if(!d.name||!d.full) return 'Ogni giorno richiede "name" e "full".';
    if(!d.pranzo||!Array.isArray(d.pranzo.ing)||!d.pranzo.title) return 'Ogni giorno richiede "pranzo" con "title" e "ing" (array).';
    if(!d.cena||!Array.isArray(d.cena.ing)||!d.cena.title) return 'Ogni giorno richiede "cena" con "title" e "ing" (array).';
  }
  return null;
}

function loadPlan(){
  try{
    const raw=localStorage.getItem(PLAN_KEY);
    if(!raw) return clonePlan(DEFAULT_PLAN);
    const parsed=JSON.parse(raw);
    if(validatePlan(parsed)) return clonePlan(DEFAULT_PLAN);
    return parsed;
  }catch(e){return clonePlan(DEFAULT_PLAN);}
}

let PLAN=loadPlan();

const MESI=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];

const PREP_BATCH=[
 ['Pasta di semola','220 g','Lunedì pranzo — metà avanza per un pranzo freddo extra'],
 ['Orzo','300 g','Martedì pranzo, insalata di orzo e tonno'],
 ['Farro','200 g','Mercoledì pranzo, farro e lenticchie'],
 ['Riso','250–300 g (2–3 porzioni)','Giovedì pranzo + Sabato pranzo al pesto'],
 ['Legumi in scatola','Sciacqua e scola ceci/lenticchie','Pronti all’uso, tolgono il sale in eccesso']
];

function categoriaSpesa(name){
  const n=name.toLowerCase();
  const has=(...ks)=>ks.some(k=>n.includes(k));
  if(has('pasta','riso','orzo','farro','cous','pane','patate','cracker','cereali','avena','grissini','biscott','wasa','bauletto','frollini','muesli','corn flakes')) return 'Carboidrati';
  if(has('verdur','pomodor','insalata','carote','zucchine','melanzane','broccoli','cavolfiore','frutta')) return 'Verdura e frutta';
  if(has('pollo','manzo','merluzzo','salmone','uov','tonno','feta','mozzarella','lenticchie','ceci','fagioli','pesce','gamberetti','vongole','cozze','tofu','affettato','prosciutto','ricotta','stracchino','cavallo','polpo','formaggio')) return 'Proteine';
  if(has('olio','pesto','cioccolat','grana','latte','kefir','yogurt','sale','spezie','salsa','passata')) return 'Dispensa';
  return 'Altro';
}

function buildSpesa(){
  const cats={'Carboidrati':[],'Proteine':[],'Verdura e frutta':[],'Dispensa':[],'Altro':[]};
  const seen=new Set();
  const add=(ing)=>{(ing||[]).forEach(pair=>{
    const clean=String(pair[0]).replace(/\s*\([^)]*\)/g,'').trim();
    if(!clean||seen.has(clean.toLowerCase())) return;
    seen.add(clean.toLowerCase());
    cats[categoriaSpesa(clean)].push(clean);
  });};
  add(PLAN.colazione.ing);add(PLAN.spMattino.ing);add(PLAN.spPomeriggio.ing);
  PLAN.days.forEach(d=>{add(d.pranzo.ing);add(d.cena.ing);});
  return cats;
}

const SPESA_KEY='piano11-spesa-checked';
function loadChecked(){try{return new Set(JSON.parse(localStorage.getItem(SPESA_KEY)||'[]'));}catch(e){return new Set();}}
function saveChecked(set){try{localStorage.setItem(SPESA_KEY,JSON.stringify([...set]));}catch(e){}}

function chips(a){return '<div class="ing">'+a.map(i=>'<span class="chip">'+i[0]+'<span class="g">'+i[1]+'</span></span>').join('')+'</div>';}
function steps(a){return '<ol class="steps">'+a.map(s=>'<li>'+s+'</li>').join('')+'</ol>';}
function renderMeal(m){
  let h='<div class="card'+(m.accent?' accent':'')+'"><div class="meal-top"><div>';
  h+='<div class="kick">'+m.kick+'</div><div class="mtitle">'+m.title+'</div></div>';
  if(m.time) h+='<span class="timepill">'+clock+m.time+'</span>';
  h+='</div>'+chips(m.ing);
  if(m.liberi&&m.liberi!=='—') h+='<div class="liberi">Liberi: '+m.liberi+'</div>';
  if(m.oppure) h+='<div class="oppure"><span>Oppure</span>'+m.oppure+'</div>';

}

function render(i){
  currentDay=i;

function renderPrep(){
  currentDay=-1;
  heroDay.textContent='Organizza';
  const checked=loadChecked();
  let h='<div class="day-label">Organizzazione settimanale</div>';

  h+='<div class="card"><div class="kick">Batch cooking</div><div class="mtitle">Cosa cuocere in anticipo</div>';
  h+='<div class="alts"><span>Inizio settimana</span><ul>'+PREP_BATCH.map(p=>'<li><b>'+p[0]+'</b> '+p[1]+' — '+p[2]+'</li>').join('')+'</ul></div></div>';

  const cats=buildSpesa();
  h+='<div class="card"><div class="meal-top"><div><div class="kick">Lista della spesa</div><div class="mtitle">Generata dal piano</div></div>';
  h+='<button class="btn" id="clearShop">Azzera spunte</button></div>';
  h+=Object.entries(cats).filter(([,items])=>items.length).map(([cat,items])=>
    '<div class="alts"><span>'+cat+'</span><ul class="shop">'+items.map(i=>{
      const on=checked.has(i)?' class="on"':'';
      return '<li'+on+' data-ing="'+i.replace(/"/g,'&quot;')+'"><span class="box"></span>'+i+'</li>';
    }).join('')+'</ul></div>').join('');
  h+='<div class="liberi">Tocca un alimento per segnarlo come preso. Le spunte restano salvate sul dispositivo.</div></div>';

  h+='<div class="card accent"><div class="kick">Trucchi</div><div class="mtitle">Per fare tutto più in fretta</div>'+steps(TRUCCHI)+'</div>';

  content.innerHTML=h;
  content.classList.remove('fade');void content.offsetWidth;content.classList.add('fade');
  [...rail.children].forEach(b=>b.setAttribute('aria-selected',b===prepBtn));

  content.querySelectorAll('.shop li').forEach(li=>{
    li.addEventListener('click',()=>{
      const set=loadChecked();

      if(li.classList.toggle('on')) set.add(ing); else set.delete(ing);
      saveChecked(set);
    });
  });
  const clear=document.getElementById('clearShop');
  if(clear) clear.addEventListener('click',()=>{
    saveChecked(new Set());
    content.querySelectorAll('.shop li.on').forEach(li=>li.classList.remove('on'));
  });
}

let prepBtn=null, pianoBtn=null;
function buildRail(){
  rail.innerHTML='';
  PLAN.days.forEach((d,i)=>{
    const b=document.createElement('button');
    b.className='dchip';b.textContent=d.name;b.setAttribute('role','tab');
    b.setAttribute('aria-selected',i===0);
    b.addEventListener('click',()=>selectDay(i));
    rail.appendChild(b);
  });

  prepBtn=document.createElement('button');
  prepBtn.className='dchip';prepBtn.textContent='Prep';prepBtn.setAttribute('role','tab');
  prepBtn.setAttribute('aria-selected','false');
  prepBtn.addEventListener('click',()=>{renderPrep();prepBtn.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});});
  rail.appendChild(prepBtn);

  pianoBtn=document.createElement('button');
  pianoBtn.className='dchip';pianoBtn.textContent='Piano';pianoBtn.setAttribute('role','tab');
  pianoBtn.setAttribute('aria-selected','false');
  pianoBtn.addEventListener('click',()=>{renderPiano();pianoBtn.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});});
  rail.appendChild(pianoBtn);
}

function planJsonString(){return JSON.stringify(PLAN,null,2);}

async function loadPdfJs(){
  if(window.pdfjsLib) return window.pdfjsLib;
  await new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.js';
    s.onload=res;s.onerror=()=>rej(new Error('Impossibile caricare il lettore PDF: serve connessione internet la prima volta.'));
    document.head.appendChild(s);
  });
  window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.js';
  return window.pdfjsLib;
}

async function extractPdfText(file){
  const pdfjsLib=await loadPdfJs();
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  let text='';
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const tc=await page.getTextContent();
    text+=tc.items.map(it=>it.str).join(' ')+'\n\n';
  }
  return text.trim();
}

function renderPiano(){
  currentDay=-1;
  heroDay.textContent='Piano';
  let h='<div class="day-label">Cambia il piano alimentare</div>';

  h+='<div class="card"><div class="kick">PDF</div><div class="mtitle">Estrai testo da un PDF</div>';
  h+='<div class="liberi">Carica il PDF del medico per leggerne il testo qui sotto: copia i valori che ti servono e incollali nel JSON del piano qui sotto. Il parsing automatico dei grammi non è affidabile su PDF con layout diversi, quindi va sempre controllato a mano. Serve connessione internet solo la prima volta (scarica il lettore PDF).</div>';
  h+='<div class="btnrow"><label class="btn">Scegli PDF<input type="file" id="pdfFile" accept="application/pdf" hidden></label></div>';
  h+='<div id="pdfMsg"></div>';
  h+='<div class="pdftext" id="pdfText" hidden></div>';
  h+='</div>';

  h+='<div class="card accent"><div class="kick">Editor</div><div class="mtitle">Piano in formato JSON</div>';
  h+='<div class="liberi">Modifica i valori qui sotto (o incolla/importa un piano esportato in precedenza) e premi <b>Applica modifiche</b>. Resta salvato su questo dispositivo, senza bisogno di toccare il codice dell’app.</div>';
  h+='<textarea class="field" id="planEditor" rows="14" spellcheck="false">'+planJsonString()+'</textarea>';
  h+='<div class="btnrow">';
  h+='<button class="btn primary" id="applyBtn">Applica modifiche</button>';
  h+='<button class="btn" id="exportBtn">Esporta JSON</button>';
  h+='<label class="btn">Importa file JSON<input type="file" id="jsonFile" accept="application/json" hidden></label>';
  h+='<button class="btn" id="resetBtn">Ripristina piano originale</button>';
  h+='</div>';
  h+='<div id="planMsg"></div>';
  h+='</div>';

  content.innerHTML=h;
  content.classList.remove('fade');void content.offsetWidth;content.classList.add('fade');
  [...rail.children].forEach(b=>b.setAttribute('aria-selected',b===pianoBtn));

  const pdfMsg=document.getElementById('pdfMsg');
  const pdfText=document.getElementById('pdfText');
  document.getElementById('pdfFile').addEventListener('change',async (e)=>{
    const file=e.target.files[0];
    if(!file) return;
    pdfMsg.innerHTML='<div class="msg">Lettura in corso…</div>';
    pdfText.hidden=true;
    try{
      const text=await extractPdfText(file);
      pdfText.textContent=text||'(nessun testo trovato — il PDF potrebbe essere una scansione/immagine)';
      pdfText.hidden=false;
      pdfMsg.innerHTML='<div class="msg ok">Testo estratto. Copia i valori che ti servono nel JSON qui sotto.</div>';
    }catch(err){
      pdfMsg.innerHTML='<div class="msg err">'+(err&&err.message?err.message:'Errore nella lettura del PDF.')+'</div>';
    }
  });

  const planMsg=document.getElementById('planMsg');
  const planEditor=document.getElementById('planEditor');

  document.getElementById('applyBtn').addEventListener('click',()=>{
    let parsed;
    try{ parsed=JSON.parse(planEditor.value); }
    catch(e){ planMsg.innerHTML='<div class="msg err">JSON non valido: '+e.message+'</div>'; return; }
    const err=validatePlan(parsed);
    if(err){ planMsg.innerHTML='<div class="msg err">'+err+'</div>'; return; }
    PLAN=parsed;
    try{localStorage.setItem(PLAN_KEY,JSON.stringify(PLAN));}catch(e){}
    planMsg.innerHTML='<div class="msg ok">Piano applicato e salvato su questo dispositivo. Tocca un giorno per vederlo.</div>';
    buildRail();
    [...rail.children].forEach(b=>b.setAttribute('aria-selected',b===pianoBtn));
  });

  document.getElementById('exportBtn').addEventListener('click',()=>{
    const blob=new Blob([planJsonString()],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='piano11.json';a.click();
    URL.revokeObjectURL(url);
  });

  document.getElementById('jsonFile').addEventListener('change',(e)=>{
    const file=e.target.files[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{ planEditor.value=reader.result; };
    reader.readAsText(file);
  });

  document.getElementById('resetBtn').addEventListener('click',()=>{
    if(!confirm('Ripristinare il piano originale? Le modifiche correnti andranno perse.')) return;
    try{localStorage.removeItem(PLAN_KEY);}catch(e){}
    PLAN=clonePlan(DEFAULT_PLAN);
    buildRail();
    renderPiano();
    const m=document.getElementById('planMsg');
    if(m) m.innerHTML='<div class="msg ok">Piano originale ripristinato.</div>';
  });
}

buildRail();

// Swipe orizzontale tra i giorni (solo quando si sta visualizzando un giorno)
let tsx=0,tsy=0;
content.addEventListener('touchstart',e=>{const t=e.changedTouches[0];tsx=t.clientX;tsy=t.clientY;},{passive:true});
content.addEventListener('touchend',e=>{
  if(currentDay<0) return;
  const t=e.changedTouches[0];
  const dx=t.clientX-tsx, dy=t.clientY-tsy;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.6) selectDay(currentDay+(dx<0?1:-1));
},{passive:true});

// Frecce tastiera per spostarsi tra le schede
rail.addEventListener('keydown',e=>{
  if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft') return;
  const items=[...rail.children];
  let idx=items.findIndex(b=>b.getAttribute('aria-selected')==='true');
  if(idx<0) idx=0;
  idx=(idx+(e.key==='ArrowRight'?1:-1)+items.length)%items.length;
  items[idx].click();items[idx].focus();
  e.preventDefault();
});
