<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Icona "Mela-agenda": la polpa della mela è una pagina d'agenda con le righe dei cinque pasti -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FACB66"/><stop offset="1" stop-color="#E8951E"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.5"><stop offset="0" stop-color="#FFEBB8" stop-opacity=".85"/><stop offset="1" stop-color="#FFEBB8" stop-opacity="0"/></radialGradient>
    <radialGradient id="skin" cx="0.34" cy="0.22" r="0.9"><stop offset="0" stop-color="#B4F08F"/><stop offset=".35" stop-color="#62C85A"/><stop offset=".75" stop-color="#2E9440"/><stop offset="1" stop-color="#17602A"/></radialGradient>
    <radialGradient id="flesh" cx="0.5" cy="0.15" r="0.95"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".7" stop-color="#FBFBF4"/><stop offset="1" stop-color="#EFEEDB"/></radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ED477"/><stop offset="1" stop-color="#2A8A3B"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C859B"/><stop offset=".38" stop-color="#F4F6FA"/><stop offset=".55" stop-color="#FFFFFF"/><stop offset="1" stop-color="#5E677D"/></linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7A5230"/><stop offset="1" stop-color="#4A2F18"/></linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#86E07A"/><stop offset="1" stop-color="#23893C"/></linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="30" stdDeviation="32" flood-color="#7A4300" flood-opacity=".42"/></filter>
    <filter id="b16"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="b6"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="b3"><feGaussianBlur stdDeviation="3"/></filter>
    <path id="apple" d="M512 318 C470 268 400 250 336 262 C240 280 190 368 196 480 C204 640 300 800 410 846 C450 862 482 852 512 840 C542 852 574 862 614 846 C724 800 820 640 828 480 C834 368 784 280 688 262 C624 250 554 268 512 318 Z"/>
    <clipPath id="clip"><use href="#apple"/></clipPath>
    <!-- la pagina: rientra di qualche pixel dalla buccia, bordo superiore appena curvo -->
    <path id="page" d="M150 508 C330 492 694 492 874 508 V900 H150 Z"/>
    <clipPath id="pageclip"><use href="#page"/></clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="540" r="440" fill="url(#glow)"/>
  <!-- ombra di contatto -->
  <ellipse cx="512" cy="872" rx="250" ry="34" fill="#7A4300" opacity=".35" filter="url(#b16)"/>

  <!-- buccia -->
  <g filter="url(#drop)"><use href="#apple" fill="url(#skin)"/></g>

  <g clip-path="url(#clip)">
    <!-- bordo di buccia visibile intorno alla polpa -->
    <use href="#page" fill="url(#rim)" transform="translate(0 -14)"/>
    <!-- polpa: rientra dalla buccia di 18 px -->
    <g clip-path="url(#pageclip)">
      <use href="#apple" fill="url(#flesh)" transform="translate(512 560) scale(0.955) translate(-512 -560)"/>
      <!-- luce sul bordo superiore della pagina -->
      <path d="M150 510 C330 494 694 494 874 510" stroke="#FFFFFF" stroke-width="6" fill="none"/>
      <!-- ombra della buccia sopra la pagina -->
      <path d="M150 512 C330 496 694 496 874 512" stroke="#1E5A28" stroke-width="22" fill="none" opacity=".16" filter="url(#b6)"/>
      <!-- spessore dei fogli -->
      <path d="M326 806 C420 832 604 832 698 806" stroke="#E3E2CC" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path d="M366 830 C440 850 584 850 658 830" stroke="#E3E2CC" stroke-width="6" fill="none" stroke-linecap="round"/>
      <!-- righe dei pasti -->
      <g stroke-linecap="round">
        <circle cx="330" cy="604" r="13" fill="#F0B040"/><path d="M366 604 H672" stroke="#F0B040" stroke-width="18"/>
        <circle cx="330" cy="664" r="13" fill="#22946F"/><path d="M366 664 H612" stroke="#22946F" stroke-width="18"/>
        <circle cx="330" cy="724" r="13" fill="#2F63D6"/><path d="M366 724 H644" stroke="#2F63D6" stroke-width="18"/>
        <circle cx="330" cy="784" r="13" fill="#7457CC"/><path d="M366 784 H560" stroke="#7457CC" stroke-width="18"/>
      </g>
    </g>
    <!-- bordo della buccia: scuro e sottile, sfumato verso l'interno -->
    <use href="#apple" fill="none" stroke="#17602A" stroke-width="14" opacity=".55" filter="url(#b3)"/>
  </g>

  <!-- riflessi lucidi -->
  <ellipse cx="338" cy="372" rx="56" ry="100" fill="#fff" opacity=".55" filter="url(#b16)" transform="rotate(32 338 372)"/>
  <ellipse cx="300" cy="414" rx="13" ry="30" fill="#fff" opacity=".9" filter="url(#b3)" transform="rotate(32 300 414)"/>
  <ellipse cx="700" cy="330" rx="30" ry="14" fill="#fff" opacity=".35" filter="url(#b6)" transform="rotate(20 700 330)"/>

  <!-- anelli: forati nella buccia, con l'ombra sulla pagina -->
  <g>
    <g fill="#0E3A17" opacity=".9">
      <ellipse cx="371" cy="462" rx="21" ry="11"/><ellipse cx="512" cy="460" rx="21" ry="11"/><ellipse cx="653" cy="462" rx="21" ry="11"/>
    </g>
    <g fill="#5A4A10" opacity=".25" filter="url(#b6)">
      <rect x="360" y="530" width="34" height="34" rx="17"/><rect x="501" y="528" width="34" height="34" rx="17"/><rect x="642" y="530" width="34" height="34" rx="17"/>
    </g>
    <g fill="url(#ring)">
      <rect x="354" y="452" width="34" height="100" rx="17"/>
      <rect x="495" y="450" width="34" height="100" rx="17"/>
      <rect x="636" y="452" width="34" height="100" rx="17"/>
    </g>
    <g fill="#5E677D" opacity=".35">
      <rect x="354" y="530" width="34" height="22" rx="11"/><rect x="495" y="528" width="34" height="22" rx="11"/><rect x="636" y="530" width="34" height="22" rx="11"/>
    </g>
  </g>

  <!-- picciolo e foglia -->
  <path d="M512 314 C506 264 518 224 546 192" stroke="url(#stem)" stroke-width="24" stroke-linecap="round" fill="none"/>
  <path d="M550 212 C598 138 696 132 736 160 C700 238 612 262 550 212 Z" fill="url(#leaf)"/>
  <path d="M736 160 C700 238 612 262 550 212 C620 214 690 196 736 160 Z" fill="#1E7A35" opacity=".45"/>
  <path d="M558 208 C614 186 670 172 724 162" stroke="#D6F5D2" stroke-width="8" stroke-linecap="round" fill="none" opacity=".85"/>
</svg>
