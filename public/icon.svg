<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Icona "Piatto della giornata": il bordo del piatto ha i cinque colori dei pasti. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26357A"/>
      <stop offset="1" stop-color="#172049"/>
    </linearGradient>
    <radialGradient id="plate" cx="0.42" cy="0.36" r="0.75">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9EDF6"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#070C24" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- Il disegno sta al 90%: resta lontano dagli angoli arrotondati di iOS. -->
  <g transform="translate(51.2 40) scale(0.9)">

  <!-- Forchetta -->
  <g fill="#F4F6FB">
    <rect x="132" y="470" width="34" height="338" rx="17"/>
    <path d="M104 232 h14 v168 h14 v-168 h14 v168 h14 v-168 h14 v168 h14 v-168 h14 v190 c0 40 -28 70 -56 78 h-8 c-28 -8 -56 -38 -56 -78 z"/>
  </g>
  <!-- Coltello -->
  <g fill="#F4F6FB">
    <rect x="858" y="508" width="34" height="300" rx="17"/>
    <path d="M858 524 V300 C858 248 884 222 920 222 V524 Z"/>
  </g>

  <!-- Piatto -->
  <g filter="url(#shadow)">
    <circle cx="512" cy="508" r="300" fill="url(#plate)"/>
  </g>
  <circle cx="512" cy="508" r="196" fill="#FFFFFF"/>
  <circle cx="512" cy="508" r="196" fill="none" stroke="#DCE2EF" stroke-width="6"/>

  <!-- Bordo: i cinque pasti, da colazione (in alto) in senso orario -->
  <g fill="none" stroke-width="42" stroke-linecap="round" transform="rotate(-81 512 508)">
    <circle cx="512" cy="508" r="250" stroke="#F0B040" stroke-dasharray="246 1325"/>
    <circle cx="512" cy="508" r="250" stroke="#22946F" stroke-dasharray="246 1325" stroke-dashoffset="-314.2"/>
    <circle cx="512" cy="508" r="250" stroke="#2F63D6" stroke-dasharray="246 1325" stroke-dashoffset="-628.4"/>
    <circle cx="512" cy="508" r="250" stroke="#7457CC" stroke-dasharray="246 1325" stroke-dashoffset="-942.6"/>
    <circle cx="512" cy="508" r="250" stroke="#26357A" stroke-dasharray="246 1325" stroke-dashoffset="-1256.8"/>
  </g>

  <!-- Foglia -->
  <g transform="translate(512 508) rotate(-38)">
    <path d="M0 -142 C104 -86 112 72 0 142 C-112 72 -104 -86 0 -142 Z" fill="#1F9A72"/>
    <path d="M0 -142 C104 -86 112 72 0 142 Z" fill="#178562"/>
    <path d="M0 -108 V150" fill="none" stroke="#EAF7F1" stroke-width="12" stroke-linecap="round"/>
    <path d="M0 -40 L44 -76 M0 12 L52 -26 M0 64 L46 30 M0 -14 L-44 -50 M0 38 L-50 2" fill="none" stroke="#EAF7F1" stroke-width="9" stroke-linecap="round" opacity="0.8"/>
  </g>
  </g>
</svg>
